<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💖</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(ellipse 80% 60% at 50% 110%, rgba(255, 183, 130, 0.55) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 15% 25%, rgba(255, 154, 180, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse 45% 35% at 85% 20%, rgba(180, 160, 255, 0.3) 0%, transparent 50%),
        linear-gradient(180deg, #0b1026 0%, #1a1040 22%, #3d2060 48%, #8e3a5e 72%, #ffb07a 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", sans-serif;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.9) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 25% 8%, rgba(255,255,255,0.7) 50%, transparent 51%),
        radial-gradient(1px 1px at 40% 22%, rgba(255,255,255,0.6) 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 55% 12%, rgba(255,255,255,0.8) 50%, transparent 51%),
        radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,0.5) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 85% 10%, rgba(255,255,255,0.75) 50%, transparent 51%),
        radial-gradient(1px 1px at 92% 28%, rgba(255,255,255,0.6) 50%, transparent 51%),
        radial-gradient(1px 1px at 18% 35%, rgba(255,255,255,0.45) 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 78% 38%, rgba(255,255,255,0.55) 50%, transparent 51%);
    animation: starsPulse 4s ease-in-out infinite alternate;
}

@keyframes starsPulse {
    from { opacity: 0.6; }
    to   { opacity: 1; }
}

#container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    z-index: 1;
}

svg {
    width: min(440px, 94vw);
    height: auto;
    filter: drop-shadow(0 14px 36px rgba(0, 0, 0, 0.45));
}

.drawable {
    fill: transparent;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: var(--len, 1000);
    stroke-dashoffset: var(--len, 1000);
    opacity: 0;
    transition: fill 0.45s ease, opacity 0.15s;
}

.drawable.visible { opacity: 1; }
.drawable.drawing { animation: drawStroke var(--dur, 0.5s) ease-out forwards; }
.drawable.done { opacity: 1; stroke-dashoffset: 0; }

@keyframes drawStroke {
    to { stroke-dashoffset: 0; }
}

/* Oso */
.bear-line    { stroke: #fff8f0; stroke-width: 2.2; }
.bear-body-c  { stroke: #edd5bc; stroke-width: 2; }
.bear-dark    { stroke: #a07850; stroke-width: 1.7; }
.bear-pink    { stroke: #ffadc0; stroke-width: 1.5; }
.eye-white    { stroke: #fff; stroke-width: 1.5; }

.drawable.done.bear-body-c  { fill: #f2dcc8; }
.drawable.done.bear-fill    { fill: #ffe8d4; }
.drawable.done.bear-belly   { fill: #fff5eb; }
.drawable.done.bear-inner-ear { fill: #ffc0d0; }
.drawable.done.bear-nose    { fill: #8b6040; }
.drawable.done.bear-blush   { fill: rgba(255, 150, 170, 0.55); stroke: none; }
.drawable.done.eye-white    { fill: #fff; }
.drawable.done.eye-fill     { fill: #2a1820; }
.drawable.done.paw-pad      { fill: #ffb8c8; stroke: none; }
.drawable.done.nose-shine    { fill: #fff; stroke: none; }

/* Flores */
.stem-line    { stroke: #4d8a4d; stroke-width: 2; }
.leaf-line    { stroke: #5a9e5a; stroke-width: 1.6; }
.petal-pink   { stroke: #ff5c8a; stroke-width: 1.4; }
.petal-rose   { stroke: #ff8fab; stroke-width: 1.4; }
.petal-peach  { stroke: #ffaa66; stroke-width: 1.3; }
.petal-lav    { stroke: #c49bff; stroke-width: 1.3; }
.center-yell  { stroke: #ffd966; stroke-width: 1.2; }
.center-pink  { stroke: #ff7090; stroke-width: 1.2; }
.ribbon-line  { stroke: #e8456a; stroke-width: 2; }
.letter-line  { stroke: #ffe8a3; stroke-width: 2; }

.drawable.done.leaf-fill    { fill: #7ecf7e; }
.drawable.done.petal-pink   { fill: #ff6b9d; }
.drawable.done.petal-rose   { fill: #ffa0b8; }
.drawable.done.petal-peach  { fill: #ffbe80; }
.drawable.done.petal-lav    { fill: #d4b0ff; }
.drawable.done.center-yell  { fill: #ffe066; }
.drawable.done.center-pink  { fill: #ff8098; }
.drawable.done.ribbon-fill  { fill: #ff5c82; }
.drawable.done.baby-breath   { fill: #fff; stroke: none; opacity: 0.85; }

.sparkle {
    fill: rgba(255, 255, 255, 0.7);
    animation: twinkle 3s ease-in-out infinite;
}
.sparkle:nth-child(2) { animation-delay: 0.7s; }
.sparkle:nth-child(3) { animation-delay: 1.4s; }
.sparkle:nth-child(4) { animation-delay: 2.1s; }

@keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 1; }
}

#letter.ready { cursor: pointer; }
#letter.ready .drawable { stroke: #ffe8a3; }
#letter.ready:hover .drawable {
    stroke: #fff5cc;
    filter: drop-shadow(0 0 8px rgba(255, 232, 163, 0.9));
}

.hint {
    color: rgba(255, 240, 230, 0.9);
    font-size: 14px;
    min-height: 20px;
    letter-spacing: 0.4px;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.4);
    transition: opacity 0.4s;
}
.hint.hidden { opacity: 0; }

.paper {
    position: absolute;
    bottom: 68px;
    width: min(300px, 90vw);
    background: linear-gradient(180deg, #fff 0%, #fff8f5 100%);
    color: #3d2030;
    padding: 26px 24px 22px;
    border-radius: 14px;
    opacity: 0;
    transform: scale(0.85) translateY(14px);
    transition: opacity 0.55s, transform 0.55s cubic-bezier(0.34, 1.4, 0.64, 1);
    text-align: center;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.38), 0 0 0 2px rgba(255, 107, 138, 0.25);
    pointer-events: none;
}
.paper::before {
    content: "♥";
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 28px;
    background: #ff6b8a;
    color: #fff;
    border-radius: 50%;
    font-size: 14px;
    line-height: 28px;
    box-shadow: 0 4px 12px rgba(255, 107, 138, 0.5);
}
.open .paper {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
}
.paper p {
    margin: 0;
    font-size: 19px;
    line-height: 1.55;
    font-weight: 500;
}
.heart-seal {
    fill: #ff6b8a;
    stroke: #fff;
    stroke-width: 1.5;
}
</style>
</head>

<script>
const message = "Mi amor, felices 9 meses De verdad han sido los meses más bonitos de mi vida, gracias por cada momento, por tu cariño y por estar siempre conmigo. Yo también te amo muchísimo y quiero seguir construyendo muchos más recuerdos a tu lado. Eres muy especial para mí te amo mucho mi amor ❤️❤️";
const PHASES = ["bear", "bouquet", "letter"];
const PHASE_HINTS = {
    bear: "Dibujando al osito...",
    bouquet: "Agregando el ramo...",
    letter: "Preparando la carta..."
};
const ELEMENT_DURATION = 340;
const PHASE_PAUSE = 500;

function getLength(el) {
    if (typeof el.getTotalLength === "function") {
        const len = el.getTotalLength();
        if (len > 0) return len;
    }
    const tag = el.tagName.toLowerCase();
    if (tag === "circle") return 2 * Math.PI * parseFloat(el.getAttribute("r") || 0);
    if (tag === "ellipse") {
        const rx = parseFloat(el.getAttribute("rx") || 0);
        const ry = parseFloat(el.getAttribute("ry") || 0);
        return Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
    }
    if (tag === "line") {
        const x1 = parseFloat(el.getAttribute("x1"));
        const y1 = parseFloat(el.getAttribute("y1"));
        const x2 = parseFloat(el.getAttribute("x2"));
        const y2 = parseFloat(el.getAttribute("y2"));
        return Math.hypot(x2 - x1, y2 - y1);
    }
    if (tag === "rect") {
        const w = parseFloat(el.getAttribute("width") || 0);
        const h = parseFloat(el.getAttribute("height") || 0);
        return 2 * (w + h);
    }
    return 200;
}

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function drawElement(el) {
    const len = getLength(el);
    el.style.setProperty("--len", len);
    el.style.setProperty("--dur", ELEMENT_DURATION + "ms");
    el.classList.add("visible", "drawing");

    return new Promise(resolve => {
        const onEnd = () => {
            el.removeEventListener("animationend", onEnd);
            el.classList.remove("drawing");
            el.classList.add("done");
            resolve();
        };
        el.addEventListener("animationend", onEnd);
    });
}

async function drawPhase(phaseName) {
    const hint = document.getElementById("hint");
    hint.textContent = PHASE_HINTS[phaseName];

    const group = document.querySelector(`[data-phase="${phaseName}"]`);
    const elements = [...group.querySelectorAll(".drawable")];

    const byOrder = new Map();
    for (const el of elements) {
        const order = el.dataset.order;
        if (!byOrder.has(order)) byOrder.set(order, []);
        byOrder.get(order).push(el);
    }

    const orders = [...byOrder.keys()].sort((a, b) => Number(a) - Number(b));
    for (const order of orders) {
        await Promise.all(byOrder.get(order).map(drawElement));
    }
}

async function startDrawing() {
    for (const phase of PHASES) {
        await drawPhase(phase);
        await wait(PHASE_PAUSE);
    }

    const hint = document.getElementById("hint");
    hint.textContent = "Toca la carta para abrirla 💌";
    document.getElementById("letter").classList.add("ready");
    document.getElementById("letter").addEventListener("click", openLetter, { once: true });
}

function openLetter() {
    document.getElementById("container").classList.add("open");
    document.getElementById("hint").classList.add("hidden");
    typeText(message);
}

function typeText(text) {
    let i = 0;
    const output = document.getElementById("text");
    output.textContent = "";

    function typing() {
        if (i < text.length) {
            output.textContent += text.charAt(i);
            i++;
            setTimeout(typing, 45);
        }
    }

    typing();
}

startDrawing();
</script>

</body>
